[package]
name = "aegis-rtos"
version = "0.1.0"
edition = "2021"
authors = ["koushik4475 <koushik4475@gmail.com>"]
description = "Production-grade Embedded Safe-Language Firmware Kernel & Micro-OS for Microcontrollers in Rust #![no_std]"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ER-brocode/aegis-embedded-rtos"
keywords = ["rtos", "no-std", "embedded", "cortex-m", "kernel"]
categories = ["embedded", "no-std", "os"]

[features]
default = ["cortex-m-arch"]
cortex-m-arch = ["dep:cortex-m", "dep:cortex-m-rt"]
std = []

[dependencies]
cortex-m = { version = "0.7.7", optional = true, features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.3", optional = true }
embedded-hal = "1.0.0"
nb = "1.1.0"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
